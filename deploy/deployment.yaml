
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
      - name: node-app
        image: osama4747/node-k8s-app:sha-cd34898f903b30068d56d79d71d2810a4b3ab79a
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000

---

